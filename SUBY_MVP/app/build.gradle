plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.suby.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.suby.app'
        minSdk 23
        targetSdk 35
        versionCode 5
        versionName '0.5-calls-preview'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildTypes {
        debug { minifyEnabled false }
    }
}

dependencies {
    implementation 'io.livekit:livekit-android:2.30.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'\n    implementation 'androidx.activity:activity-ktx:1.10.0'\n    implementation 'androidx.core:core-ktx:1.15.0'
}

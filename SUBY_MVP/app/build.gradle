plugins { id 'com.android.application' }

android {
    namespace 'com.suby.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.suby.app'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '0.3-livekit-foundation'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
    }
}

dependencies {
    // LiveKit Android SDK foundation. Live rooms still require a secure token service.
    implementation 'io.livekit:livekit-android:2.30.0'
}

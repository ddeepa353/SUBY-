name: SUBY Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
      - name: Build SUBY MVP preview APK
        shell: bash
        run: |
          set -euo pipefail
          cd SUBY_MVP
          gradle --no-daemon assembleDebug --stacktrace
      - name: Verify APK signature and package
        shell: bash
        run: |
          set -euo pipefail
          APK=SUBY_MVP/app/build/outputs/apk/debug/app-debug.apk
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          unzip -t "$APK" >/dev/null
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SUBY-MVP-Preview-APK
          path: SUBY_MVP/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish public APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.7.2-preview
          name: SUBY Android Preview v0.7.2
          body: |
            SUBY Android preview APK. Install only on Android devices. This is a preview build; some payment, wallet and calling features may require backend activation and testing.
          files: SUBY_MVP/app/build/outputs/apk/debug/*.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

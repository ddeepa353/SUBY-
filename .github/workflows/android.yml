name: SUBY Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'
          accept-android-sdk-licenses: true

      - name: Install required SDK platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Locate and extract Android project
        run: |
          set -euxo pipefail
          mkdir -p extracted
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          test -n "$ZIP"
          unzip -q "$ZIP" -d extracted
          SETTINGS=$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
          test -n "$SETTINGS"
          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using Android project: $PROJECT_DIR"
          find "$PROJECT_DIR" -maxdepth 2 -type f | head -80

      - name: Build debug APK
        run: |
          set -euxo pipefail
          cd "$PROJECT_DIR"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SUBY-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
